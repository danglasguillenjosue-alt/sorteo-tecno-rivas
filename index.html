<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de factura</title>
<style>
  :root{
    --bg:#F6F5F2; --ink:#1E2A24; --line:#D8D4C8;
    --accent:#2F6B4F; --accent-ink:#FFFFFF; --error:#B3413A;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161A18; --ink:#EDEBE4; --line:#333B36; --accent:#5BAE87; --accent-ink:#0E1210;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161A18; --ink:#EDEBE4; --line:#333B36; --accent:#5BAE87; --accent-ink:#0E1210;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font-family:'Iowan Old Style','Georgia',serif;
    display:flex; align-items:center; justify-content:center; padding:32px 20px;
  }
  main{width:100%; max-width:420px;}
  h1{
    font-size:1.6rem; font-weight:600; margin:0 0 6px; letter-spacing:-0.01em;
  }
  p.sub{
    margin:0 0 32px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.95rem; opacity:0.7; line-height:1.5;
  }
  form{display:flex; flex-direction:column; gap:20px;}
  label{
    display:block; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.8rem; opacity:0.75; margin-bottom:6px;
  }
  input{
    width:100%; padding:14px 14px; font-size:1.05rem;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    border:1.5px solid var(--line); border-radius:6px; background:transparent; color:var(--ink);
  }
  input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  button{
    margin-top:8px; padding:14px; border:none; border-radius:6px;
    background:var(--accent); color:var(--accent-ink); font-size:1rem; font-weight:600;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    cursor:pointer;
  }
  button:disabled{opacity:0.6; cursor:default;}
  #msg{
    margin-top:16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:0.9rem; display:none;
  }
  #msg.show{display:block;}
  #msg.error{color:var(--error);}
  #msg.ok{color:var(--accent);}
  .done{display:none; text-align:center;}
  .done.show{display:block;}
  .done h1{margin-bottom:10px;}
</style>
</head>
<body>
<main>
  <div id="formWrap">
    <h1>Registro de factura</h1>
    <p class="sub">Ingresá tus datos para completar el registro.</p>
    <form id="f">
      <div>
        <label for="ced">Número de cédula</label>
        <input id="ced" name="cedula" type="text" placeholder="000-000000-0000A" required>
      </div>
      <div>
        <label for="tel">Número de teléfono</label>
        <input id="tel" name="telefono" type="tel" inputmode="tel" placeholder="8888-8888" required>
      </div>
      <div>
        <label for="fac">Número de factura</label>
        <input id="fac" name="factura" type="text" inputmode="numeric" placeholder="FAC-00123" required>
      </div>
      <div>
        <label for="tot">Total de la factura (C$)</label>
        <input id="tot" name="total" type="number" step="0.01" min="0" placeholder="1500.00" required>
      </div>
      <button type="submit" id="btn">Guardar</button>
      <div id="msg"></div>
    </form>
  </div>
  <div class="done" id="done">
    <h1>Listo</h1>
    <p class="sub">Tu registro fue guardado correctamente.</p>
  </div>
</main>
<script>
  // la url corregida para que funcione bien el string
  const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbyMeyqzDS-D-Hr4FbtTHFBKtiSTrpgEDa1zfCwhxrSD2DgDno_sE4YJgTgHhuS3ailG/exec";

  const form = document.getElementById('f');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = ''; msg.textContent = '';
    
    const cedula = document.getElementById('ced').value.trim();
    const telefono = document.getElementById('tel').value.trim();
    const factura = document.getElementById('fac').value.trim();
    const total = parseFloat(document.getElementById('tot').value.trim());

    // validación de los 1500 pesos
    if (total < 1500) {
      msg.className = 'show error';
      msg.textContent = 'el total de la factura debe ser de al menos C$ 1,500.00 para acceder.';
      return;
    }

    if (ENDPOINT_URL.includes('PEGA_AQUI')) {
      msg.className = 'show error';
      msg.textContent = 'Falta configurar la URL del Apps Script en el código de esta página.';
      return;
    }

    btn.disabled = true; btn.textContent = 'Guardando...';
    try {
      await fetch(ENDPOINT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ cedula, telefono, factura, total })
      });
      document.getElementById('formWrap').style.display = 'none';
      document.getElementById('done').classList.add('show');
    } catch (err) {
      msg.className = 'show error';
      msg.textContent = 'No se pudo enviar. Verifica tu conexión e intenta de nuevo.';
      btn.disabled = false; btn.textContent = 'Guardar';
    }
  });
</script>
</body>
</html>
