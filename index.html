<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>registro de factura</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Poppins', sans-serif; 
  }
  
  body {
    min-height: 100vh;
    /* fondo con degradado animado al suave */
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1b2838);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    padding: 20px; 
    color: #ffffff;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  main { 
    width: 100%; 
    max-width: 420px; 
  }
  
  /* la tarjeta de cristal */
  .glass-panel {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 40px 30px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
  }

  h1 { 
    font-size: 1.8rem; 
    font-weight: 600; 
    text-align: center; 
    margin-bottom: 8px; 
    color: #4ade80; /* un verde tuani */
  }
  
  p.sub { 
    text-align: center; 
    font-size: 0.9rem; 
    color: #94a3b8; 
    margin-bottom: 30px; 
  }

  form { 
    display: flex; 
    flex-direction: column; 
    gap: 18px; 
  }
  
  label {
    display: block; 
    font-size: 0.8rem; 
    color: #cbd5e1; 
    margin-bottom: 6px; 
    font-weight: 500; 
    letter-spacing: 0.5px;
  }
  
  input {
    width: 100%; 
    padding: 14px 16px; 
    font-size: 1rem;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px; 
    color: #ffffff; 
    transition: all 0.3s ease;
  }
  
  input::placeholder { color: rgba(255, 255, 255, 0.3); }
  
  input:focus { 
    outline: none; 
    border-color: #4ade80; 
    background: rgba(0, 0, 0, 0.4); 
    box-shadow: 0 0 12px rgba(74, 222, 128, 0.2); 
  }
  
  button {
    margin-top: 12px; 
    padding: 16px; 
    border: none; 
    border-radius: 12px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white; 
    font-size: 1.05rem; 
    font-weight: 600;
    cursor: pointer; 
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
  }
  
  button:hover:not(:disabled) { 
    transform: translateY(-2px); 
    box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5); 
  }
  
  button:disabled { 
    opacity: 0.6; 
    cursor: not-allowed; 
    background: #475569;
    box-shadow: none;
  }
  
  #msg { 
    margin-top: 15px; 
    font-size: 0.85rem; 
    text-align: center; 
    display: none; 
    padding: 12px; 
    border-radius: 10px; 
  }
  
  #msg.show { 
    display: block; 
    animation: fadeIn 0.3s; 
  }
  
  #msg.error { 
    background: rgba(239, 68, 68, 0.15); 
    color: #fca5a5; 
    border: 1px solid rgba(239, 68, 68, 0.3); 
  }
  
  .done { 
    display: none; 
    text-align: center; 
    padding: 20px 0; 
  }
  
  .done.show { 
    display: block; 
    animation: fadeIn 0.5s; 
  }
  
  .done h1 { color: #4ade80; margin-bottom: 10px; }
  
  @keyframes fadeIn { 
    from { opacity: 0; transform: translateY(10px); } 
    to { opacity: 1; transform: translateY(0); } 
  }
</style>
</head>
<body>
<main>
  <div id="formWrap" class="glass-panel">
    <h1>registro de factura</h1>
    <p class="sub">ingresá tus datos para completar el registro.</p>
    <form id="f">
      <div>
        <label for="ced">número de cédula</label>
        <input id="ced" name="cedula" type="text" placeholder="000-000000-0000A" required>
      </div>
      <div>
        <label for="tel">número de teléfono</label>
        <input id="tel" name="telefono" type="tel" inputmode="tel" placeholder="8888-8888" required>
      </div>
      <div>
        <label for="fac">número de factura</label>
        <input id="fac" name="factura" type="text" inputmode="numeric" placeholder="FAC-00123" required>
      </div>
      <div>
        <label for="tot">total de la factura (c$)</label>
        <input id="tot" name="total" type="number" step="0.01" min="0" placeholder="1500.00" required>
      </div>
      <button type="submit" id="btn">guardar</button>
      <div id="msg"></div>
    </form>
  </div>
  
  <div class="done glass-panel" id="done">
    <h1>¡listo!</h1>
    <p class="sub">tu registro fue guardado al suave.</p>
  </div>
</main>

<script>
  // pegá tu nuevo link de google apps script aquí
  const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbwJ7fhVPT1nbo9kKvog2GiuJsJtRpOoWGE8qZpPxRlLptlzrR2ow7iYnx7sF6fK9U1O/exec";

  const form = document.getElementById('f');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = ''; msg.textContent = '';
    
    const cedula = document.getElementById('ced').value.trim();
    const telefono = document.getElementById('tel').value.trim();
    const factura = document.getElementById('fac').value.trim();
    const total = parseFloat(document.getElementById('tot').value.trim());

    // validación de los 1500 pesos
    if (total < 1500) {
      msg.className = 'show error';
      msg.textContent = 'el total de la factura debe ser de al menos c$ 1,500.00 para acceder.';
      return;
    }

    if (ENDPOINT_URL === "tu_nuevo_link_aqui" || ENDPOINT_URL.includes('PEGA_AQUI')) {
      msg.className = 'show error';
      msg.textContent = 'falta configurar la url del apps script.';
      return;
    }

    btn.disabled = true; btn.textContent = 'verificando...';

    try {
      // 1. pedimos la lista de facturas al sheet
      const res = await fetch(ENDPOINT_URL, { redirect: 'follow' });
      const facturasUsadas = await res.json();

      // 2. revisamos si la factura ya fue ingresada
      if (facturasUsadas.includes(factura)) {
        msg.className = 'show error';
        msg.textContent = '¡esta factura ya fue registrada! revisá bien.';
        btn.disabled = false; btn.textContent = 'guardar';
        return;
      }

      btn.textContent = 'guardando...';

      // 3. si todo está chele, la guardamos
      await fetch(ENDPOINT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ cedula, telefono, factura, total })
      });
      document.getElementById('formWrap').style.display = 'none';
      document.getElementById('done').classList.add('show');
    } catch (err) {
      msg.className = 'show error';
      msg.textContent = 'no se pudo enviar. revisá tu conexión a internet.';
      btn.disabled = false; btn.textContent = 'guardar';
    }
  });
</script>
</body>
</html>
